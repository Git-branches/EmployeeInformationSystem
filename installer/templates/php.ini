; ============================================================
; Employee Information System - PHP configuration
; @@APPDIR@@ is replaced by the installer with the install path.
; ============================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zend.enable_gc = On
expose_php = Off

max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Errors are logged, never shown to the end user
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = "@@APPDIR@@/stack/php/logs/php_error.log"

; File uploads: employee photos, requirement documents, Excel/PDF imports
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 40
upload_tmp_dir = "@@APPDIR@@/stack/tmp"

default_charset = "UTF-8"
extension_dir = "@@APPDIR@@/stack/php/ext"

; Root certificates for outgoing HTTPS (Google Drive backup). Without these,
; cURL cannot verify Google's certificate and fails with
; "cURL error 60: SSL certificate problem: unable to get local issuer certificate".
curl.cainfo = "@@APPDIR@@/stack/php/extras/ssl/cacert.pem"
openssl.cafile = "@@APPDIR@@/stack/php/extras/ssl/cacert.pem"

; ---- Extensions -------------------------------------------
; This block is generated by build.ps1 from the extensions that the bundled
; PHP build actually ships as DLLs. Some builds compile zip/gd in statically,
; in which case they are simply absent here and still available.
; {#EXTENSIONS#}

[Date]
date.timezone = Asia/Manila

[Session]
session.save_handler = files
session.save_path = "@@APPDIR@@/stack/tmp"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 28800

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
