# ============================================================
# Employee Information System - MariaDB / MySQL configuration
# @@APPDIR@@ is replaced by the installer with the install path.
# Runs on port 3307 so it never clashes with an existing MySQL.
# ============================================================

[mysqld]
basedir  = "@@APPDIR@@/stack/mariadb"
datadir  = "@@APPDIR@@/stack/mariadb/data"
port     = 3307
bind-address = 127.0.0.1
socket   = eis_mysql

character-set-server = utf8mb4
collation-server     = utf8mb4_unicode_ci

max_connections = 50
max_allowed_packet = 64M
table_open_cache = 400
tmp_table_size = 32M
max_heap_table_size = 32M

innodb_buffer_pool_size = 128M
innodb_log_file_size = 48M
innodb_flush_log_at_trx_commit = 2
innodb_file_per_table = 1

log_error = "@@APPDIR@@/stack/mariadb/data/mysql_error.log"

# skip-name-resolve is deliberately NOT enabled. The server is initialised
# with a root@localhost account only; without name resolution a TCP client
# coming from 127.0.0.1 would not match it (ERROR 1130). The setup script
# also creates an explicit root@127.0.0.1 account.

[client]
port = 3307
socket = eis_mysql
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4

[mysqldump]
max_allowed_packet = 64M
