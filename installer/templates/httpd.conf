# ============================================================
# Employee Information System - Apache configuration
# {#APPDIR#} is replaced by the installer with the install path.
# Serves the app at http://localhost:8080/
# ============================================================

Define SRVROOT "{#APPDIR#}/stack/apache"
ServerRoot "${SRVROOT}"

Listen 8080
ServerName localhost:8080

# ---- Modules -----------------------------------------------
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mpm_winnt_module modules/mod_mpm_winnt.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule env_module modules/mod_env.so

# ---- PHP ---------------------------------------------------
LoadModule php_module "{#APPDIR#}/stack/php/php8apache2_4.dll"
AddHandler application/x-httpd-php .php
PHPIniDir "{#APPDIR#}/stack/php"

# ---- Document root ----------------------------------------
DocumentRoot "{#APPDIR#}/www"

<Directory "{#APPDIR#}/www">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

<IfModule dir_module>
    DirectoryIndex index.php index.html
</IfModule>

# Never serve the raw source of these
<FilesMatch "\.(ini|log|sql|json)$">
    Require all denied
</FilesMatch>
<Files ".htaccess">
    Require all denied
</Files>

# ---- Logging ----------------------------------------------
ErrorLog "{#APPDIR#}/stack/apache/logs/error.log"
LogLevel warn
<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog "{#APPDIR#}/stack/apache/logs/access.log" common
</IfModule>

# ---- MIME --------------------------------------------------
<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
</IfModule>

# ---- Misc --------------------------------------------------
<IfModule mpm_winnt_module>
    ThreadsPerChild 64
    MaxConnectionsPerChild 0
</IfModule>

DefaultRuntimeDir "${SRVROOT}/logs"
PidFile "${SRVROOT}/logs/httpd.pid"
TimeOut 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
AccessFileName .htaccess
ServerTokens Prod
ServerSignature Off
HostnameLookups Off
EnableSendfile Off
EnableMMAP Off
